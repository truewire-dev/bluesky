name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e 'packages/python[dev]'
      - name: Spec checks
        run: .venv/bin/truewire check
      - name: Standards
        run: .venv/bin/truewire standards
      - name: Generated code is current
        # `--check` compares the manifest; regenerating and diffing also catches a
        # stale file body. `generate` runs pyright over src and test on the way.
        run: |
          .venv/bin/truewire generate python --check
          .venv/bin/truewire generate python
          .venv/bin/truewire generate typescript --check
          .venv/bin/truewire generate typescript
          .venv/bin/truewire generate rust --check
          .venv/bin/truewire generate rust
          git diff --exit-code -- packages .truewire
      - name: Tests against the mock server
        run: .venv/bin/python -m pytest packages/python/test -q -rs
      - name: Type usage
        run: .venv/bin/pyright --project packages/python/pyrightconfig.json
      - name: Lint and format
        run: |
          .venv/bin/ruff check --config packages/python/ruff.toml packages/python/src packages/python/test
          .venv/bin/ruff format --check --config packages/python/ruff.toml packages/python/src packages/python/test

  typescript:
    name: TypeScript client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        # `truewire mock` serves the recordings the tests replay, so the Python toolchain
        # is needed here too.
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e 'packages/python[dev]'
          cd packages/typescript && yarn install --frozen-lockfile
      - name: Type check
        working-directory: packages/typescript
        run: yarn run typecheck
      - name: Replay the recordings through the generated client
        working-directory: packages/typescript
        run: yarn run test

  rust:
    name: Rust client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        # `truewire mock` serves the recordings the tests replay, so the Python toolchain
        # is needed here too.
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e 'packages/python[dev]'
      - name: Build without warnings
        working-directory: packages/rust
        env:
          RUSTFLAGS: -D warnings
        run: cargo build
      - name: Replay the recordings through the generated client
        working-directory: packages/rust
        run: cargo test

  recordings:
    name: Every endpoint has a recording
    runs-on: ubuntu-latest
    # Required since the first recordings landed (#1). Eleven of the twelve endpoints carry
    # a recorded pair; `feed.search_posts` carries a declaration that it needs a credential
    # to get one, which is the only reason `packages/python/test/verified.py --check` accepts in place of a
    # recording. So an endpoint added without either now fails the pull request.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e 'packages/python[dev]'
      - name: Recorded, or declared why not
        run: .venv/bin/truewire examples --require-verified --verbose
      - name: Recorded, every one
        run: .venv/bin/python packages/python/test/verified.py --check
