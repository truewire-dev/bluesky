name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python ${{ matrix.python }} .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Spec checks
        run: .venv/bin/truewire check
      - name: Standards
        run: .venv/bin/truewire standards
      - name: Generated code is current
        # `--check` compares the manifest; regenerating and diffing also catches a
        # stale file body. `generate` runs pyright over src and test on the way.
        run: |
          .venv/bin/truewire generate python --check
          .venv/bin/truewire generate python
          git diff --exit-code -- src .truewire
      - name: Tests against the mock server
        run: .venv/bin/python -m pytest -q -rs
      - name: Type usage
        run: .venv/bin/pyright
      - name: Lint and format
        run: |
          .venv/bin/ruff check src test
          .venv/bin/ruff format --check src test

  recordings:
    name: Every endpoint has a recording
    runs-on: ubuntu-latest
    # Required since the first recordings landed (#1). Eleven of the twelve endpoints carry
    # a recorded pair; `feed.search_posts` carries a declaration that it needs a credential
    # to get one, which is the only reason `test/verified.py --check` accepts in place of a
    # recording. So an endpoint added without either now fails the pull request.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Recorded, or declared why not
        run: .venv/bin/truewire examples --require-verified --verbose
      - name: Recorded, every one
        run: .venv/bin/python test/verified.py --check
