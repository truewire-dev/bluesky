name: Record

# Re-record every example from the live Bluesky APIs and open a pull request with the
# result. Manual: Actions > Record > Run workflow. The runner has network access the
# machine this client was written on did not. Opening the pull request needs "Allow GitHub
# Actions to create and approve pull requests" under Settings > Actions > General; without
# it the branch is still pushed and the job summary links to it.
#
# An endpoint that fails to record does not stop the others: the pull request carries
# whatever the API did answer, the endpoints that failed keep declaring why they have no
# recording, and the job still ends red so the failure is not lost. An endpoint that
# declares `unverified.reason: "missing_credentials"` is skipped rather than attempted,
# and is not a failure.
on:
  # Recordings go stale on their own: a live API changes underneath them, and nothing in
  # this repository notices until someone re-records. So the runner re-records weekly by
  # itself and opens the pull request; a human or an agent only has to judge the diff.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      jetstream_seconds:
        description: How long to read the Jetstream firehose, in seconds.
        default: '10'
      jetstream_limit:
        description: How many Jetstream events to keep per subscription.
        default: '20'

permissions:
  contents: write
  pull-requests: write

jobs:
  record:
    runs-on: ubuntu-latest
    # The app password lives on this environment rather than loose in the repository's
    # secrets, and the environment allows only `main`. A repository secret is readable by
    # any workflow on any branch, which for a credential that can post publicly as the
    # account is more surface than this job needs. No required reviewers: they would block
    # the weekly schedule forever, which is the whole point of it being weekly.
    environment: bluesky
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e 'packages/python[dev]'
      - name: Record through the generated client
        # Almost no credentials: the public AppView answers every XRPC call here but search
        # without one, and Jetstream is open. `truewire capture` records the ten request/reply
        # pairs it can; it refuses a stream endpoint, so the firehose is read for a bounded
        # window through the same generated client and the events it pushed are written beside
        # the subscription's parameters. `feed.search_posts` declares that it needs a
        # credential and is skipped rather than attempted.
        env:
          PYTHON: .venv/bin/python
          JETSTREAM_SECONDS: ${{ inputs.jetstream_seconds || '10' }}
          JETSTREAM_LIMIT: ${{ inputs.jetstream_limit || '20' }}
          # The write half's credentials. Absent, the eleven public endpoints still record
          # and the four authenticated ones fail, which the job reports without losing the
          # rest.
          # A handle is public, so it belongs in a variable -- but it costs nothing to
          # accept it as a secret too, and that removes a way for the weekly run to fail
          # silently on a Monday because it was set in the other place.
          BLUESKY_IDENTIFIER: ${{ vars.BLUESKY_IDENTIFIER || secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        # Failures are reported by the script and re-raised at the end of the job, so the
        # recordings that did succeed still reach a pull request.
        continue-on-error: true
        id: record
        run: PATH="$PWD/.venv/bin:$PATH" sh packages/python/test/recapture.sh
      - name: Gates on the recordings
        run: |
          .venv/bin/truewire check
          .venv/bin/truewire examples --require-verified --verbose | tee coverage.txt
          .venv/bin/python -m pytest packages/python/test -q -rs
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- spec; then
            echo "Recordings unchanged; nothing to open."
            exit 0
          fi
          branch="record/${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add spec
          git commit -m "Record examples from the live Bluesky APIs" \
            -m "Recorded by the Record workflow, run ${{ github.run_id }}, through the generated client."
          git push origin "$branch"
          {
            echo "Recorded by the [Record workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) through the generated client: \`truewire capture\` for the XRPC calls, a ${{ inputs.jetstream_seconds || '10' }}s subscription for Jetstream."
            echo
            echo "Every changed endpoint keeps its request half and gains the response the API sent. Endpoints that gained a recording no longer declare why they had none."
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } > body.md
          # A repository with "Allow GitHub Actions to create and approve pull requests"
          # off (Settings > Actions > General) pushes the branch and then cannot open
          # anything for it. The recordings are safe on the branch either way, so say
          # where they are rather than losing the run over a setting.
          if ! gh pr create --title "Record examples from the live Bluesky APIs" \
            --body-file body.md --base main --head "$branch"; then
            url="${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1"
            echo "::warning::could not open a pull request; the recordings are on $branch, open it at $url"
            { echo "### Recordings are on \`$branch\`"; echo; echo "[Open the pull request]($url)"; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Some examples did not record
        if: steps.record.outcome == 'failure'
        run: |
          echo "::error::at least one example did not record; the pull request carries the rest, and their endpoints still declare why they have none"
          exit 1
