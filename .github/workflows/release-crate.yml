name: Release the Rust client (crates.io)

# Merge a pull request from branch `release/rust` into main. If the version in
# packages/rust/Cargo.toml is not on crates.io yet, this builds, tests, publishes, tags
# `rust-v<version>` and creates the GitHub release.
#
# Also runnable by hand, for when the version bump reached `main` some other way. The
# version in Cargo.toml is the single source either way, and an already-published version
# is a no-op, so a manual run can only ever publish what a merge would have.
#
# Authentication tries Trusted Publishing (OIDC) first and falls back to the
# `CARGO_REGISTRY_TOKEN` secret on the `crates-io` environment. That order, and not the
# other one, because a stale or narrowly scoped token must not be able to shadow a working
# publisher: `truewire-core` 0.1.1 failed upstream with `403 this token does not have the
# required permissions` while a perfectly good publisher sat unused behind it.
#
# The token is still what a crate's *first* publish needs -- crates.io Trusted Publishing
# can only publish a crate that already exists, having no pending-publisher concept as PyPI
# does -- so the auth step is `continue-on-error`: no publisher yet means no token minted,
# and the secret takes over.
#
# Trusted publisher settings: owner `truewire-dev`, repository `bluesky`, workflow
# `release-crate.yml`, environment `crates-io`.
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['packages/rust/**']

permissions:
  id-token: write
  contents: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.head_ref == 'release/rust')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: version
        run: |
          version=$(grep -m1 '^version = ' packages/rust/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: check
        # Re-running a merged release must not fail the job, so an already-published
        # version is a no-op rather than an error.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/truewire-bluesky/${{ steps.version.outputs.version }}")
          if [ "$code" = "200" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    # A token, while one is still needed, lives on this environment rather than loose in
    # the repository's secrets, so it is reachable from this one job and can be gated on
    # top of that.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        # `truewire mock` serves the recordings the tests replay, so the Python toolchain
        # is needed here too.
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python --refresh-package truewire -e 'packages/python[dev]'
      - name: Gates
        # The same gates the pull request already passed, re-run against `main` as merged.
        # A crate cannot be unpublished, only yanked, so "it passed on the branch" is not
        # good enough here.
        working-directory: packages/rust
        env:
          RUSTFLAGS: -D warnings
        run: |
          cargo build
          cargo test
      - name: The crate packages cleanly
        # `cargo package` also builds the extracted tarball, which is where a stray path or
        # git dependency, or a file the manifest forgot to include, actually shows up.
        working-directory: packages/rust
        run: cargo package
      - name: Trusted Publishing token
        # Allowed to fail: the action errors when the crate has no trusted publisher
        # configured, which is its first publish and exactly when the token takes over.
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "publishing with ${{ steps.auth.outputs.token && 'trusted publishing' || 'the CARGO_REGISTRY_TOKEN secret' }}"
          cargo publish
      - id: previous_tag
        run: |
          previous=$(git tag -l 'rust-v*' | sort -V | tail -1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - run: git tag rust-v${{ needs.check.outputs.version }}
      - run: git push origin rust-v${{ needs.check.outputs.version }}
      - if: steps.previous_tag.outputs.previous != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-v${{ needs.check.outputs.version }}
          name: truewire-bluesky ${{ needs.check.outputs.version }}
          previous_tag: ${{ steps.previous_tag.outputs.previous }}
          generate_release_notes: true
          body: |
            Published to [crates.io](https://crates.io/crates/truewire-bluesky/${{ needs.check.outputs.version }}) as `truewire-bluesky = "${{ needs.check.outputs.version }}"`.

            ${{ github.event.pull_request.body }}
      - if: steps.previous_tag.outputs.previous == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rust-v${{ needs.check.outputs.version }}
          name: truewire-bluesky ${{ needs.check.outputs.version }}
          generate_release_notes: true
          body: |
            Published to [crates.io](https://crates.io/crates/truewire-bluesky/${{ needs.check.outputs.version }}) as `truewire-bluesky = "${{ needs.check.outputs.version }}"`.

            ${{ github.event.pull_request.body }}
