name: Release the TypeScript client (npm)

# Merge a pull request from branch `release/typescript` into main. If the version in
# packages/typescript/package.json is not on npm yet, this builds, publishes, tags
# `typescript-v<version>` and creates the GitHub release.
#
# Also runnable by hand, for when the version bump reached `main` some other way. The
# version in package.json is the single source either way, and an already-published version
# is a no-op, so a manual run can only ever publish what a merge would have.
#
# Authentication tries Trusted Publishing (OIDC) first and falls back to the `NPM_TOKEN`
# secret on the `npm` environment. That order matters more here than anywhere: npm *prefers
# a token* whenever `NODE_AUTH_TOKEN` is set, so a leftover secret does not merely sit
# unused, it silently wins -- and the release looks exactly the same either way. The token
# step therefore only runs when the tokenless publish has already failed.
#
# The token is still what a package's *first* publish needs: npm's trusted publisher is
# configured on an existing package's settings page, so -- as on crates.io, and unlike
# PyPI with its pending publishers -- it cannot create one.
#
# Trusted publisher settings: owner `truewire-dev`, repository `bluesky`, workflow
# `release-npm.yml`, environment `npm`.
on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]
    paths: ['packages/typescript/**']

permissions:
  id-token: write
  contents: write

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.head_ref == 'release/typescript')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: version
        run: |
          version=$(node -p "require('./packages/typescript/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: check
        # Re-running a merged release must not fail the job, so an already-published
        # version is a no-op rather than an error. `npm view` prints the version when it
        # exists; it prints nothing (or fails with 404 while the package has never been
        # published at all) when it does not.
        run: |
          if found=$(npm view "@truewire/bluesky@${{ steps.version.outputs.version }}" version 2>/dev/null) && [ -n "$found" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    # A token, while one is still needed, lives on this environment rather than loose in
    # the repository's secrets, so it is reachable from this one job and can be gated on
    # top of that.
    environment: npm
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: yarn
          cache-dependency-path: packages/typescript/yarn.lock
      - name: Install
        # `truewire mock` serves the recordings the tests replay, so the Python toolchain
        # is needed here too.
        run: |
          uv venv --python 3.12 ../../.venv
          uv pip install --python ../../.venv/bin/python --refresh-package truewire -e '../../packages/python[dev]'
          yarn install --frozen-lockfile
      - name: Gates
        # The same gates the pull request already passed, re-run against `main` as merged.
        # A release is the one place where "it passed on the branch" is not good enough.
        # The test harness starts `truewire mock` from the repository's own `.venv`.
        run: |
          yarn typecheck
          yarn test
      - name: Build
        run: yarn build
      - name: Package contents match package.json
        # Every file `exports`, `main` and `types` point at must exist in dist/ and be
        # inside the `files` list, so a consumer resolves what the manifest promises.
        run: |
          node --input-type=module - <<'EOF'
          import { existsSync } from 'node:fs'
          import { readFile } from 'node:fs/promises'
          import { execFileSync } from 'node:child_process'
          const pkg = JSON.parse(await readFile('package.json', 'utf8'))
          const targets = new Set([pkg.main, pkg.types].filter(Boolean))
          const walk = (v) => typeof v === 'string' ? targets.add(v) : Object.values(v).forEach(walk)
          walk(pkg.exports)
          const packed = JSON.parse(execFileSync('npm', ['pack', '--dry-run', '--json', '--ignore-scripts'], { encoding: 'utf8' }))
          const shipped = new Set(packed[0].files.map((f) => f.path))
          const missing = [...targets].filter((t) => !existsSync(t))
          const unshipped = [...targets].filter((t) => !shipped.has(t.replace(/^\.\//, '')))
          if (missing.length || unshipped.length) {
            console.error('not built:', missing, '\nnot in the tarball:', unshipped)
            process.exit(1)
          }
          console.log(`${shipped.size} files in the tarball; every entry point is present`)
          EOF
      - name: Upgrade npm
        # Trusted publishing needs npm 11.5.1 or newer, which the version bundled with
        # Node 22 is not.
        run: |
          npm install -g npm@latest
          npm --version
      - name: Publish through trusted publishing
        # Tried first, and allowed to fail: this is the path that needs no credential at
        # all, and the only way to be sure it is the one taken is to take it before a token
        # is anywhere in the environment. npm mints a short-lived credential from this
        # job's OIDC token (`id-token: write`, above) and attests provenance by itself, so
        # `--provenance` is not passed and no `NODE_AUTH_TOKEN` is set.
        id: oidc
        continue-on-error: true
        run: npm publish --access public
      - name: Publish with a token
        # The package's first publish, before a trusted publisher can exist. `--provenance`
        # is explicit here: a token publish attests nothing by itself.
        if: steps.oidc.outcome == 'failure'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
      - id: previous_tag
        run: |
          previous=$(git tag -l 'typescript-v*' | sort -V | tail -1)
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
      - run: git tag typescript-v${{ needs.check.outputs.version }}
      - run: git push origin typescript-v${{ needs.check.outputs.version }}
      - if: steps.previous_tag.outputs.previous != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: typescript-v${{ needs.check.outputs.version }}
          name: "@truewire/bluesky ${{ needs.check.outputs.version }}"
          previous_tag: ${{ steps.previous_tag.outputs.previous }}
          generate_release_notes: true
          body: |
            Published to [npm](https://www.npmjs.com/package/@truewire/bluesky/v/${{ needs.check.outputs.version }}) as `@truewire/bluesky@${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
      - if: steps.previous_tag.outputs.previous == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: typescript-v${{ needs.check.outputs.version }}
          name: "@truewire/bluesky ${{ needs.check.outputs.version }}"
          generate_release_notes: true
          body: |
            Published to [npm](https://www.npmjs.com/package/@truewire/bluesky/v/${{ needs.check.outputs.version }}) as `@truewire/bluesky@${{ needs.check.outputs.version }}`.

            ${{ github.event.pull_request.body }}
