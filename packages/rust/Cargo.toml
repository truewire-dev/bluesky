[package]
name = "truewire-bluesky"
version = "0.2.0"
edition = "2021"
description = "Typed, validated Rust client for Bluesky's public API and the Jetstream firehose, generated by Truewire."
license = "MIT"
repository = "https://github.com/truewire-dev/bluesky"
homepage = "https://truewire.dev"
documentation = "https://docs.rs/truewire-bluesky"
readme = "README.md"
keywords = ["bluesky", "atproto", "jetstream", "api-bindings", "truewire"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
# The package is `truewire-bluesky` -- `bluesky` on crates.io is squatted by an unrelated
# placeholder -- but the library it exposes is `bluesky`, which is what the generated
# source, the tests and the README all import.
name = "bluesky"
path = "src/bluesky/lib.rs"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
truewire-core = { version = "0.1", features = ["rustls-tls"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
