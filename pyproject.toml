[project]
name = "truewire-bluesky"
version = "0.1.0"
description = "Typed, validated Python client for Bluesky's public API and the Jetstream firehose, generated by Truewire."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["truewire-core>=0.2.1,<0.3"]
keywords = ["bluesky", "atproto", "at-protocol", "jetstream", "api-client", "truewire"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/truewire-dev/bluesky"
Truewire = "https://truewire.dev"

[project.optional-dependencies]
dev = [
  "truewire==0.6.0",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pyright>=1.1.390",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bluesky = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "strict"
pythonpath = ["src"]
